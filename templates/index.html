<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lunch Choice System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>School Lunch Choice System</h1>
            <h2>Select your class</h2>
        </div>

        <div class="class-grid">
            {% for class in classes %}
            <a href="{{ url_for('teacher_menu', class_id=class.id) }}" class="class-card">
                <h3>{{ class.name }}</h3>
                <span class="arrow">→</span>
            </a>
            {% endfor %}
        </div>

    </div>
</body>
</html>
